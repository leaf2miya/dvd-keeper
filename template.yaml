AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DVD Keeper - S3 to DynamoDB sync

Globals:
  Function:
    Timeout: 30
    Runtime: python3.14

Parameters:
  S3ObjectHomePath:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/s3/object-home-path
  DynamoDBTableName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/dynamo/dbname
  SnsFailureTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/sns/failure-topic
  FailureS3Path:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/s3/event-failed-store
  DynamoDBStreamArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/dynamo/stream-arn
  MarkdownOutputPath:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/s3/markdown-output-path

Resources:
  S3ToDynamoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dvdKeeperS3ToDynamo
      Handler: s3_to_dynamo.handler
      CodeUri: src/handlers/
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref DynamoDBTableName
        - S3ReadPolicy:
            BucketName: !Select [2, !Split ["/", !Ref S3ObjectHomePath]]
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref SnsFailureTopicArn

  S3ToDynamoEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref S3ToDynamoFunction
      Qualifier: $LATEST
      DestinationConfig:
        OnFailure:
          Destination: !Ref SnsFailureTopicArn

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3ToDynamoFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub
        - "arn:aws:s3:::${BucketName}"
        - BucketName: !Select [2, !Split ["/", !Ref S3ObjectHomePath]]

  DynamoUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dvdKeeperDynamoUpdate
      Handler: bootstrap
      CodeUri: lambda/dynamo-update/
      Runtime: provided.al2023
      AutoPublishAlias: live
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          FAILURE_S3_PATH: !Ref FailureS3Path
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}"
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !Select [2, !Split ["/", !Ref FailureS3Path]]
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource: !Ref DynamoDBStreamArn
    Metadata:
      BuildMethod: makefile

  DynamoUpdateEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !GetAtt DynamoUpdateFunction.Arn
      EventSourceArn: !Ref DynamoDBStreamArn
      StartingPosition: LATEST
      BatchSize: 10
      MaximumRetryAttempts: 2
      MaximumRecordAgeInSeconds: 86400
      ParallelizationFactor: 1
      BisectBatchOnFunctionError: true
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT"]}'

  DynamoToMarkdownFullSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dvdKeeperDynamoToMarkdownFullSync
      Handler: dynamo_to_markdown.full_sync_handler
      CodeUri: src/handlers/
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          MARKDOWN_OUTPUT_PATH: !Ref MarkdownOutputPath
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoDBTableName
        - S3CrudPolicy:
            BucketName: !Select [2, !Split ["/", !Ref MarkdownOutputPath]]
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref SnsFailureTopicArn

  DynamoToMarkdownFullSyncEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref DynamoToMarkdownFullSyncFunction
      Qualifier: $LATEST
      DestinationConfig:
        OnFailure:
          Destination: !Ref SnsFailureTopicArn

  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowSnsPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref SnsFailureTopicArn
        - PolicyName: AllowLambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DynamoToMarkdownFullSyncFunction.Arn

  DynamoToMarkdownFullSyncSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dvdKeeper-DynamoToMarkdownFullSync
      ScheduleExpression: cron(0 3 ? * SUN *)
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt DynamoToMarkdownFullSyncFunction.Arn
        RoleArn: !GetAtt EventBridgeSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

  DynamoToMarkdownFullSyncScheduleNotification:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dvdKeeper-DynamoToMarkdownFullSync-Notification
      ScheduleExpression: cron(0 3 ? * SUN *)
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !Ref SnsFailureTopicArn
        RoleArn: !GetAtt EventBridgeSchedulerRole.Arn
        Input: '{"message": "DynamoDB to Markdown full sync started"}'

  DynamoToMarkdownFullSyncInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DynamoToMarkdownFullSyncFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt DynamoToMarkdownFullSyncSchedule.Arn

  DynamoUpdateErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dvdKeeper-DynamoUpdateFunction-Errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref DynamoUpdateFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsFailureTopicArn

Outputs:
  S3ToDynamoFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt S3ToDynamoFunction.Arn
  S3ToDynamoFunctionName:
    Description: Lambda Function Name
    Value: !Ref S3ToDynamoFunction
  DynamoUpdateFunctionArn:
    Description: DynamoDB Update Lambda Function ARN
    Value: !GetAtt DynamoUpdateFunction.Arn
  DynamoUpdateFunctionName:
    Description: DynamoDB Update Lambda Function Name
    Value: !Ref DynamoUpdateFunction
  DynamoToMarkdownFullSyncFunctionArn:
    Description: DynamoDB to Markdown Full Sync Lambda Function ARN
    Value: !GetAtt DynamoToMarkdownFullSyncFunction.Arn
  DynamoToMarkdownFullSyncFunctionName:
    Description: DynamoDB to Markdown Full Sync Lambda Function Name
    Value: !Ref DynamoToMarkdownFullSyncFunction
