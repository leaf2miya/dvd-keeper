AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DVD Keeper - S3 to DynamoDB sync

Globals:
  Function:
    Timeout: 30
    Runtime: python3.14

Parameters:
  S3ObjectHomePath:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/s3/object-home-path
  DynamoDBTableName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/dynamo/dbname
  SnsFailureTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/sns/failure-topic
  FailureS3Path:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /dvd-keeper/s3/event-failed-store

Resources:
  S3ToDynamoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dvdKeeperS3ToDynamo
      Handler: s3_to_dynamo.handler
      CodeUri: src/handlers/
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref DynamoDBTableName
        - S3ReadPolicy:
            BucketName: !Select [2, !Split ["/", !Ref S3ObjectHomePath]]
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref SnsFailureTopicArn

  S3ToDynamoEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref S3ToDynamoFunction
      Qualifier: $LATEST
      DestinationConfig:
        OnFailure:
          Destination: !Ref SnsFailureTopicArn

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3ToDynamoFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub
        - "arn:aws:s3:::${BucketName}"
        - BucketName: !Select [2, !Split ["/", !Ref S3ObjectHomePath]]

  DynamoUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dvdKeeperDynamoUpdate
      Handler: bootstrap
      CodeUri: lambda/dynamo-update/
      Runtime: provided.al2023
      AutoPublishAlias: live
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          FAILURE_S3_PATH: !Ref FailureS3Path
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}"
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !Select [2, !Split ["/", !Ref FailureS3Path]]
    Metadata:
      BuildMethod: makefile

Outputs:
  S3ToDynamoFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt S3ToDynamoFunction.Arn
  S3ToDynamoFunctionName:
    Description: Lambda Function Name
    Value: !Ref S3ToDynamoFunction
  DynamoUpdateFunctionArn:
    Description: DynamoDB Update Lambda Function ARN
    Value: !GetAtt DynamoUpdateFunction.Arn
  DynamoUpdateFunctionName:
    Description: DynamoDB Update Lambda Function Name
    Value: !Ref DynamoUpdateFunction
